<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01472e"/>
      <stop offset="100%" stop-color="#002b1c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefae0"/>
      <stop offset="100%" stop-color="#ccd5ae"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield / Circle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#ccd5ae" stroke-width="2"/>
  
  <!-- Stylized Culinary Cloche & Fork Monogram -->
  <g fill="url(#goldGrad)" transform="translate(12, 12)">
    <!-- Cloche Top Knob -->
    <circle cx="20" cy="7" r="3"/>
    
    <!-- Cloche Dome -->
    <path d="M 6 22 A 14 14 0 0 1 34 22 Z"/>
    
    <!-- Cloche Tray Base -->
    <rect x="4" y="24" width="32" height="3" rx="1.5"/>
    
    <!-- Hyphen / Brand Line -->
    <rect x="12" y="30" width="16" height="2.5" rx="1.25"/>
  </g>
</svg>
